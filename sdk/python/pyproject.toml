# Runtime: standard library only (spec §11.6). setuptools is needed only to
# build/install the package with pip; sensors can also vendor truesignal_sdk/.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "truesignal-sdk"
version = "3.0.0"
description = "TrueSignal sensor SDK (contract v3), standard library only"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["truesignal_sdk"]
