# Runtime: standard library only (spec §11.6). setuptools is needed only to
# build/install the package with pip; sensors can also vendor doppel_sdk/.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel-sdk"
version = "3.0.0"
description = "Doppel sensor SDK (contract v3), standard library only"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["doppel_sdk", "truesignal_sdk"]
