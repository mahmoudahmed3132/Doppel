#
# Sensor publish (§10). Tag sensor/<name>/vX.Y.Z -> image built, scanned,
# pushed and signed; manifest pinned to the pushed digest, validated with the
# Hub's production rules, signed (detached Sigstore bundle) and committed to
# the registry branch of the public releases repository
# (<owner>/truesignal-releases; this repository is private) with a
# regenerated index.json. Concurrent sensor publishes retry the registry push
# on conflict.
# Signing identity (consumed by the PORTED verifier):
#   https://github.com/<repo>/.github/workflows/publish-sensor.yml@refs/tags/sensor/<name>/v<version>
name: publish-sensor

on:
  push:
    tags: ["sensor/*/v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4"
  ISSUER: https://token.actions.githubusercontent.com
  RELEASES_REPO: ${{ github.repository_owner }}/truesignal-releases

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      alias: ${{ steps.image.outputs.alias }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: tag matches manifest version, is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH" | tee -a "$GITHUB_OUTPUT"
      - id: image
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          # F-004: doppel-sensor-<name> is the product name; ts-sensor-<name> stays a
          # compatibility alias (same digest) for one major version. The signed manifest
          # names exactly one of them as its image.repository; the other is the alias.
          o=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          declared=$(jq -r .image.repository "sensors/$NAME/manifest.json")
          case "$declared" in
            "$o/doppel-sensor-$NAME") alias="$o/ts-sensor-$NAME" ;;
            "$o/ts-sensor-$NAME") alias="$o/doppel-sensor-$NAME" ;;
            *) echo "::error::manifest image.repository must be $o/doppel-sensor-$NAME or the legacy $o/ts-sensor-$NAME"; exit 1 ;;
          esac
          echo "image=$declared" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: refuse a version already in the registry
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          (cd hub && go build -o "$RUNNER_TEMP/ts-registry" ./cmd/ts-registry)
          # The registry branch lives in the public releases repository (read anonymously).
          url="https://github.com/$RELEASES_REPO.git"
          set +e; git ls-remote --exit-code --heads "$url" refs/heads/registry >/dev/null; rc=$?; set -e
          if [ "$rc" -eq 0 ]; then
            git fetch --quiet --no-tags "$url" +refs/heads/registry:refs/remotes/releases/registry
            git worktree add --quiet --detach "$RUNNER_TEMP/reg" refs/remotes/releases/registry
            set +e; "$RUNNER_TEMP/ts-registry" published -dir "$RUNNER_TEMP/reg" -name "$NAME" -version "$VERSION"; rc=$?; set -e
            [ "$rc" -eq 3 ] || { echo "::error::$NAME@$VERSION is already in the registry (or the check failed: $rc)"; exit 1; }
          elif [ "$rc" -ne 2 ]; then
            echo "::error::cannot read the registry branch of $RELEASES_REPO (git exit $rc)"; exit 1
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: refuse an existing image tag (immutable; never overwritten)
        env:
          VER: ${{ steps.tag.outputs.version }}
          IMG: ${{ steps.image.outputs.image }}
          ALIAS: ${{ steps.image.outputs.alias }}
        run: |
          for REF in "$IMG:$VER" "$ALIAS:$VER"; do
            if docker buildx imagetools inspect "$REF" >/dev/null 2>err.txt; then
              echo "::error::$REF exists but the version is not in the registry: a previous run failed after pushing. Investigate; delete the package version deliberately before re-running."
              exit 1
            fi
            grep -qiE 'not found|manifest unknown|name unknown' err.txt || { cat err.txt; echo "::error::cannot determine whether $REF exists"; exit 1; }
          done

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # the registry is pushed to the releases repository with the App token
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      ALIAS: ${{ needs.guard.outputs.alias }}
      NAME: ${{ needs.guard.outputs.name }}
      VERSION: ${{ needs.guard.outputs.version }}
      IMAGE: ${{ needs.guard.outputs.image }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-sensor.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - run: cd hub && go build -o "$RUNNER_TEMP/ts-registry" ./cmd/ts-registry
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sensors/${{ env.NAME }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/ts-sensor:${{ env.VERSION }}
      - name: scan (fixable HIGH/CRITICAL fail before anything is pushed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: scan/ts-sensor:${{ env.VERSION }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: gate - no unwaived critical vulnerability, fixable or not (scripts/release/trivy-gate.sh)
        run: scripts/release/trivy-gate.sh image "scan/ts-sensor:$VERSION"
      - id: push
        name: build and push (linux/amd64, as declared in the manifest; primary and alias, same digest)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sensors/${{ env.NAME }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.ALIAS }}:${{ env.VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: sign the image; pin, validate and sign the manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest from the push"; exit 1; }
          for R in "$IMAGE" "$ALIAS"; do
            cosign sign --yes "$R@$DIGEST"
            cosign verify "$R@$DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          done
          # CycloneDX SBOM of the image (covers the sensor binary), attested on both names.
          scripts/release/sbom.sh image "$IMAGE@$DIGEST" "$RUNNER_TEMP/sbom.cdx.json"
          for R in "$IMAGE" "$ALIAS"; do
            cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom.cdx.json" "$R@$DIGEST"
            cosign verify-attestation --type cyclonedx "$R@$DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          done
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          "$RUNNER_TEMP/ts-registry" fill -in "sensors/$NAME/manifest.json" -out "$out/manifest.json" \
            -name "$NAME" -version "$VERSION" -repository "$IMAGE" -tag "$VERSION" -digest "$DIGEST"
          cosign sign-blob --yes --bundle "$out/manifest.json.sigstore.json" "$out/manifest.json"
          cosign verify-blob --bundle "$out/manifest.json.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$out/manifest.json"
      - id: releases-token
        name: token for the public releases repository (GitHub App, contents:write on that repository only)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: truesignal-releases
          permission-contents: write
      - name: commit to the registry branch of the releases repository (retry on conflict)
        env:
          RELEASES_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          . scripts/release/releases-auth.sh
          REGISTRY_REMOTE="$RELEASES_URL" scripts/release/registry-commit.sh "registry: $NAME $VERSION" \
            "$GITHUB_WORKSPACE/scripts/release/registry-add.sh" "$RUNNER_TEMP/ts-registry" "$NAME" "$VERSION" "$RUNNER_TEMP/out"

  provenance:
    # SLSA v1 build provenance (slsa-github-generator; referenced by tag as the generator requires).
    # Runs after the registry commit so a failed publish never leaves provenance for an unlisted version.
    needs: [guard, publish]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.guard.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}
