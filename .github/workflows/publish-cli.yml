#
# CLI publish (§10, Q46). Tag cli/vX.Y.Z -> static linux and darwin
# (amd64, arm64) binaries, SHA256SUMS, one Sigstore bundle per binary (keyless, this
# workflow's identity at the tag), GitHub release in the public releases
# repository (<owner>/truesignal-releases). install.sh verifies exactly
# this identity, so the file name of this workflow is part of the contract.
name: publish-cli

on:
  push:
    tags: ["cli/v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4"
  RELEASES_REPO: ${{ github.repository_owner }}/truesignal-releases

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: tag matches code version, is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH" | tee -a "$GITHUB_OUTPUT"
      - name: refuse an already published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --json assets --jq '.assets | length' 2>&1); then
            if [ "$out" -gt 0 ]; then
              echo "::error::$GITHUB_REF_NAME already has $out release assets; published versions are never rebuilt"
              exit 1
            fi
          elif ! echo "$out" | grep -qi "release not found"; then
            echo "::error::cannot determine whether $GITHUB_REF_NAME is published: $out"
            exit 1
          fi

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # Sigstore keyless signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-cli.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: build static binaries
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              (cd cli && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOWORK=off \
                go build -trimpath -ldflags "-s -w -buildid= -X main.Version=$VERSION" -o "../dist/doppel-$os-$arch" ./cmd/doppel)
            done
          done
          for arch in amd64 arm64; do
            file "dist/doppel-linux-$arch" | grep -q "statically linked" || { echo "::error::linux/$arch binary is not static"; exit 1; }
            file "dist/doppel-darwin-$arch" | grep -q "Mach-O" || { echo "::error::darwin/$arch binary is not Mach-O"; exit 1; }
          done
          ./dist/doppel-linux-amd64 version | grep -F "$VERSION"
          (cd dist && sha256sum doppel-linux-amd64 doppel-linux-arm64 doppel-darwin-amd64 doppel-darwin-arm64 > SHA256SUMS && cat SHA256SUMS)
      - name: sign and verify (Sigstore keyless)
        run: |
          for f in dist/doppel-linux-amd64 dist/doppel-linux-arm64 dist/doppel-darwin-amd64 dist/doppel-darwin-arm64; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: gate - no unwaived critical vulnerability in any binary (scripts/release/trivy-gate.sh)
        run: |
          for f in dist/doppel-*-*; do
            case "$f" in *.sigstore.json) continue ;; esac
            d=$(mktemp -d); cp "$f" "$d/"; scripts/release/trivy-gate.sh rootfs "$d"
          done
      - name: CycloneDX SBOM per binary
        run: |
          for f in dist/doppel-linux-amd64 dist/doppel-linux-arm64 dist/doppel-darwin-amd64 dist/doppel-darwin-arm64; do
            scripts/release/sbom.sh binary "$f" "$f.cdx.json"
            cosign sign-blob --yes --bundle "$f.cdx.json.sigstore.json" "$f.cdx.json"
          done
      - id: hash
        name: subjects for the SLSA provenance
        run: echo "hashes=$(cd dist && sha256sum doppel-linux-amd64 doppel-linux-arm64 doppel-darwin-amd64 doppel-darwin-arm64 | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: the installer accepts these assets (checksum + signature)
        run: |
          sh install.sh --version "$VERSION" --base-url "file://$PWD/dist" --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/truesignal" version | grep -F "$VERSION"

  provenance:
    # SLSA v1 provenance (slsa-github-generator; referenced by tag as the generator requires).
    needs: [guard, publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      upload-assets: false
      provenance-name: doppel-cli-${{ needs.guard.outputs.version }}.intoto.jsonl

  release:
    needs: [guard, publish, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # the release is created in the releases repository with the App token
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-cli.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist
      - run: chmod +x dist/doppel-*-* 2>/dev/null || true
      - id: releases-token
        name: token for the public releases repository (GitHub App, contents:write on that repository only)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: truesignal-releases
          permission-contents: write
      - name: create the release in the public releases repository
        env:
          RELEASES_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          scripts/release/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<NOTES

          ### Install and verify
          \`\`\`sh
          curl -fsSLO https://raw.githubusercontent.com/$RELEASES_REPO/$GITHUB_REF_NAME/install.sh
          sudo sh install.sh --version $VERSION --sha256 <hash from SHA256SUMS>
          # manual check:
          sha256sum -c SHA256SUMS --ignore-missing
          cosign verify-blob --bundle doppel-linux-amd64.sigstore.json \\
            --certificate-identity $IDENTITY \\
            --certificate-oidc-issuer $ISSUER doppel-linux-amd64
          # SBOM (CycloneDX) is signed too; SLSA v1 provenance:
          slsa-verifier verify-artifact doppel-linux-amd64 --provenance-path doppel-cli-$VERSION.intoto.jsonl \\
            --source-uri github.com/$GITHUB_REPOSITORY --source-tag $GITHUB_REF_NAME
          \`\`\`
          NOTES
          scripts/release/publish-release.sh --install-sh install.sh "$GITHUB_REF_NAME" "CLI v$VERSION" notes.md \
            dist/doppel-linux-amd64 dist/doppel-linux-arm64 dist/doppel-darwin-amd64 dist/doppel-darwin-arm64 dist/SHA256SUMS \
            dist/doppel-linux-amd64.sigstore.json dist/doppel-linux-arm64.sigstore.json \
            dist/doppel-darwin-amd64.sigstore.json dist/doppel-darwin-arm64.sigstore.json \
            dist/doppel-linux-amd64.cdx.json dist/doppel-linux-arm64.cdx.json dist/doppel-darwin-amd64.cdx.json dist/doppel-darwin-arm64.cdx.json \
            dist/doppel-linux-amd64.cdx.json.sigstore.json dist/doppel-linux-arm64.cdx.json.sigstore.json \
            dist/doppel-darwin-amd64.cdx.json.sigstore.json dist/doppel-darwin-arm64.cdx.json.sigstore.json \
            "dist/doppel-cli-$VERSION.intoto.jsonl"
