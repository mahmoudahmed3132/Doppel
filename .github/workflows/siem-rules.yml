name: SIEM rules

# Runs the Elastic detection rules (docs/siem/elastic/) through a real
# Elasticsearch + Kibana detection engine against the Hub's emitted samples
# (docs/siem/testdata/detection-samples.ndjson, kept current by the Go test
# hub/internal/siemrules TestSIEMDetectionSamples in CI).

on:
  push:
    branches: [main]
    paths:
      - "docs/siem/**"
      - "docs/siem-integration.md"
      - "scripts/siem-rules/**"
      - ".github/workflows/siem-rules.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/siem/**"
      - "docs/siem-integration.md"
      - "scripts/siem-rules/**"
      - ".github/workflows/siem-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elastic:
    name: Elastic rules (ES + Kibana 8.19)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run the rules against the sample corpus
        run: scripts/siem-rules/run-elastic.sh
