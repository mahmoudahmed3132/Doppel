# CodeQL for Go and JavaScript/TypeScript (§10).
name: codeql

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read     # private repository: the action reads its workflow run
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: "**/go.sum"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'go'
        name: build every module
        run: |
          for m in $(sed -n 's/^\t\.\/\(.*\)$/\1/p' go.work); do
            (cd "$m" && go build ./... && go test -count=1 -run '^$' ./... >/dev/null)
          done
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
