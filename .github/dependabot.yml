# Proposes bumps for SHA-pinned actions, Go modules, UI packages and base images.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directories: ["/hub", "/cli", "/sdk/go", "/sensors/*"]
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: ["/hub", "/sensors/*", "/sdk/python/template"]
    schedule: {interval: weekly}
