#
# Nginx stand-in for an F5 BIG-IP performing client-side TLS termination and
# server-side TLS re-encryption to the Doppel Hub's native TLS listener (H1).
# Overwrites (never appends) X-Forwarded-For and X-Forwarded-Proto, proxies
# WebSocket /api/v3/live with a long idle timeout, and checks /readyz.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/proxy_cert.pem;
    ssl_certificate_key /etc/nginx/certs/proxy_key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # Overwrite forwarding headers so a client cannot spoof them.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Server-side re-encryption to the Hub's native TLS listener.
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/nginx/certs/hub_ca.pem;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;

    location = /api/v3/live {
        proxy_pass https://172.30.0.10:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass https://172.30.0.10:8443;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
