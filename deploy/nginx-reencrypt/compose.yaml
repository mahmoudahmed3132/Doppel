#
# Staging / CI stand-in for an off-host F5 BIG-IP performing client-side TLS
# termination and server-side TLS re-encryption to the Doppel Hub (H1).
# CI can only test the Hub side; validate the real F5 BIG-IP virtual server,
# SSL profiles, iRules, and ASM policy in staging (see docs/operations.md).
# Replace <digest> placeholders with verified digests before running.
name: doppel-nginx-reencrypt
services:
  hub:
    image: ghcr.io/mahmoudahmed3132/doppel-hub:3.0.0@sha256:<digest>
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TS_ENV: production
      TS_LISTEN_ADDR: "0.0.0.0"
      TS_LISTEN_PORT: "8443"
      TS_TLS_CERT_FILE: /run/secrets/hub_tls_cert
      TS_TLS_KEY_FILE: /run/secrets/hub_tls_key
      TS_TRUSTED_PROXIES: "172.30.0.0/24"
      TS_REQUIRE_MFA: "true"
      TS_KEK_FILE: /run/secrets/hub_kek
      TS_METRICS_ADDR: "127.0.0.1:9090"
    secrets:
      - hub_kek
      - hub_tls_cert
      - hub_tls_key
    volumes:
      - hub-data:/data
    networks:
      vdc-internal:
        ipv4_address: 172.30.0.10
    mem_limit: 512m
    pids_limit: 256

  proxy:
    image: nginx:1.27-alpine@sha256:<digest>
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/var/cache/nginx:size=16m", "/var/run:size=4m", "/tmp:size=8m"]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/proxy_cert.pem:/etc/nginx/certs/proxy_cert.pem:ro
      - ./secrets/proxy_key.pem:/etc/nginx/certs/proxy_key.pem:ro
      - ./secrets/hub_ca.pem:/etc/nginx/certs/hub_ca.pem:ro
    networks:
      vdc-internal:
        ipv4_address: 172.30.0.2
    depends_on:
      - hub
    mem_limit: 128m
    pids_limit: 128

secrets:
  hub_kek:
    file: ./secrets/hub_kek
  hub_tls_cert:
    file: ./secrets/hub_tls_cert.pem
  hub_tls_key:
    file: ./secrets/hub_tls_key.pem

networks:
  vdc-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  hub-data: {}
